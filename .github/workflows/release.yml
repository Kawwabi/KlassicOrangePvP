name: Ultimate Universal Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Selection Mode'
        type: choice
        options:
          - 'only'
          - 'all_but'
          - 'all'
        default: 'only'
        required: true
      v_1_8:
        description: '1.6.1-1.8.9'
        required: false
        default: false
        type: boolean
      v_1_9:
        description: '1.9-1.10.2'
        required: false
        default: false
        type: boolean
      v_1_11:
        description: '1.11-1.12.2'
        required: false
        default: false
        type: boolean
      v_1_13:
        description: '1.13-1.14.4'
        required: false
        default: false
        type: boolean
      v_1_15:
        description: '1.15-1.16.1'
        required: false
        default: false
        type: boolean
      v_1_16:
        description: '1.16.2-1.16.5'
        required: false
        default: false
        type: boolean
      v_1_17:
        description: '1.17-1.17.1'
        required: false
        default: false
        type: boolean
      v_1_18:
        description: '1.18-1.18.2'
        required: false
        default: false
        type: boolean
      v_1_19:
        description: '1.19-1.19.2'
        required: false
        default: false
        type: boolean
      v_1_19_3:
        description: '1.19.3'
        required: false
        default: false
        type: boolean
      v_1_19_4:
        description: '1.19.4'
        required: false
        default: false
        type: boolean
      v_1_20:
        description: '1.20-1.20.1'
        required: false
        default: false
        type: boolean
      v_1_20_2:
        description: '1.20.2-26.x'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  setup:
    name: Prepare Build Matrix
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: Calculate Target Matrix
        id: set-matrix
        env:
          INPUTS_JSON: ${{ toJson(inputs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ALL_VERSIONS='[
            {"key": "v_1_8", "filename": "1.6.1-1.8.9", "mc_ver": "1.8", "format": 1, "is_base": true},
            {"key": "v_1_9", "filename": "1.9-1.10.2", "mc_ver": "1.9", "format": 2},
            {"key": "v_1_11", "filename": "1.11-1.12.2", "mc_ver": "1.11", "format": 3},
            {"key": "v_1_13", "filename": "1.13-1.14.4", "mc_ver": "1.13", "format": 4},
            {"key": "v_1_15", "filename": "1.15-1.16.1", "mc_ver": "1.15", "format": 5},
            {"key": "v_1_16", "filename": "1.16.2-1.16.5", "mc_ver": "1.16.2", "format": 6},
            {"key": "v_1_17", "filename": "1.17-1.17.1", "mc_ver": "1.17", "format": 7},
            {"key": "v_1_18", "filename": "1.18-1.18.2", "mc_ver": "1.18", "format": 8},
            {"key": "v_1_19", "filename": "1.19-1.19.2", "mc_ver": "1.19", "format": 9},
            {"key": "v_1_19_3", "filename": "1.19.3", "mc_ver": "1.19.3", "format": 12},
            {"key": "v_1_19_4", "filename": "1.19.4", "mc_ver": "1.19.4", "format": 13},
            {"key": "v_1_20", "filename": "1.20-1.20.1", "mc_ver": "1.20", "format": 15},
            {"key": "v_1_20_2", "filename": "1.20.2-26.x", "mc_ver": "1.21.4", "format": 88, "is_modern": true}
          ]'

          MODE=$(echo "$INPUTS_JSON" | jq -r '.mode // "only"')

          if [ "$EVENT_NAME" = "release" ] || [ "$MODE" = "all" ]; then
            COMPACT=$(echo "$ALL_VERSIONS" | jq -c '{include: .}')
          elif [ "$MODE" = "all_but" ]; then
            COMPACT=$(echo "$ALL_VERSIONS" | jq -c --argjson inputs "$INPUTS_JSON" '{
              include: [.[] | select(($inputs[.key] // false) == false)]
            }')
          else
            COMPACT=$(echo "$ALL_VERSIONS" | jq -c --argjson inputs "$INPUTS_JSON" '{
              include: [.[] | select(($inputs[.key] // false) == true)]
            }')
          fi

          SELECTED_COUNT=$(echo "$COMPACT" | jq '.include | length')
          if [ "$SELECTED_COUNT" -eq 0 ]; then
            echo "::error::No versions were selected for building."
            exit 1
          fi

          echo "matrix=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "count=$SELECTED_COUNT" >> "$GITHUB_OUTPUT"

  build_packs:
    name: Build ${{ matrix.filename }}
    needs: setup
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (For Converter)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download ResourcePackConverter
        run: wget -q -O converter.jar https://github.com/agentdid127/ResourcePackConverter/releases/download/2.2.6/ResourcePackConverter.jar

      - name: Prepare Base Version (1.8.9)
        if: matrix.is_base
        run: |
          mkdir -p build_dir
          cp -r src/* build_dir/

      - name: Convert to Newer Versions
        if: '!matrix.is_base'
        run: |
          mkdir -p build_dir
          cp -r src ToConvert
          java -Xms2G -Xmx8G -jar converter.jar --from 1.8 --to ${{ matrix.mc_ver }} --input ToConvert
          CONVERTED_DIR=$(find . -maxdepth 1 -type d -name "ToConvert_*" | head -n 1)
          if [ -n "$CONVERTED_DIR" ]; then
            cp -r "$CONVERTED_DIR"/* build_dir/
          else
            cp -r ToConvert/* build_dir/
          fi
          rm -rf ToConvert ToConvert_* converter.jar

          # --- 1. SELECTIVE OVERRIDES & CONVERSION CLEANUP ---

          # Creative Tabs Override (Format 12+)
          CREATIVE_GUI="build_dir/assets/minecraft/textures/gui/container/creative_inventory"
          if [ "${{ matrix.format }}" -ge 12 ]; then
            if [ -f "modern_override/assets/minecraft/textures/gui/container/creative_inventory/tabsfor1.19.3+.png" ]; then
              mkdir -p "$CREATIVE_GUI"
              cp -f "modern_override/assets/minecraft/textures/gui/container/creative_inventory/tabsfor1.19.3+.png" "$CREATIVE_GUI/tabs.png"
            fi
          fi
          rm -f "$CREATIVE_GUI/tabsfor1.19.3+.png" 2>/dev/null || true

          # Spawn Eggs for 1.9 to 1.12.2 (Formats 2 & 3)
          if [ "${{ matrix.format }}" -ge 2 ] && [ "${{ matrix.format }}" -lt 4 ]; then
            if [ -d "modern_override/assets/minecraft/optifine/cit/spawn_egg" ]; then
              mkdir -p build_dir/assets/minecraft/mcpatcher/cit/spawn_egg
              cp -r modern_override/assets/minecraft/optifine/cit/spawn_egg/* build_dir/assets/minecraft/mcpatcher/cit/spawn_egg/ 2>/dev/null || true
            fi
          fi

          # Bed Models (Format 2 Only)
          if [ "${{ matrix.format }}" -eq 2 ]; then
            mkdir -p build_dir/assets/minecraft/models/item build_dir/assets/minecraft/models/block
            find build_dir/assets/minecraft/models/item/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            find build_dir/assets/minecraft/models/block/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            if [ -f "modern_override/assets/minecraft/models/item/bed.json" ]; then
              cp modern_override/assets/minecraft/models/item/bed.json build_dir/assets/minecraft/models/item/ 2>/dev/null || true
            fi
            if [ -d "modern_override/assets/minecraft/models/block" ]; then
              cp -r modern_override/assets/minecraft/models/block/*bed*.json build_dir/assets/minecraft/models/block/ 2>/dev/null || true
            fi
          fi

          # Cleanup Bed Models (Format 3+)
          if [ "${{ matrix.format }}" -ge 3 ]; then
            find build_dir/assets/minecraft/models/item/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            find build_dir/assets/minecraft/models/block/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            find build_dir/assets/minecraft/blockstates/ -type f -name "*bed*.json" -delete 2>/dev/null || true
          fi

          # Command Block Models: Pre-Flattening (Formats 2 & 3) vs Modern (Format 4+)
          if [ "${{ matrix.format }}" -ge 2 ] && [ "${{ matrix.format }}" -lt 4 ]; then
            if [ -d "src/assets/minecraft/models/block" ]; then
              mkdir -p build_dir/assets/minecraft/models/block
              cp -f src/assets/minecraft/models/block/*command_block*.json build_dir/assets/minecraft/models/block/ 2>/dev/null || true
            fi
          elif [ "${{ matrix.format }}" -ge 4 ]; then
            if [ -d "modern_override/assets/minecraft/models/block" ]; then
              mkdir -p build_dir/assets/minecraft/models/block
              cp -f modern_override/assets/minecraft/models/block/*command_block*.json build_dir/assets/minecraft/models/block/ 2>/dev/null || true
            fi
          fi

          # Modern GUI Sprites (Format 18+)
          if [ "${{ matrix.format }}" -ge 18 ]; then
            if [ -d "modern_override/assets/minecraft/textures/gui/sprites" ]; then
              mkdir -p build_dir/assets/minecraft/textures/gui/sprites
              cp -rf modern_override/assets/minecraft/textures/gui/sprites/. build_dir/assets/minecraft/textures/gui/sprites/ 2>/dev/null || true
            fi
          fi

          # Modern Overrides for Format 4+ (Flattening+)
          if [ "${{ matrix.format }}" -ge 4 ]; then
            if [ -d "modern_override" ]; then
              cp -rn modern_override/* build_dir/ 2>/dev/null || true
            fi
          fi

          # Locale Files for 1.9 - 1.12.2 (Formats 2 & 3)
          if [ "${{ matrix.format }}" -eq 3 ]; then
            mkdir -p build_dir/assets/minecraft/lang
            if [ -f "build_dir/assets/minecraft/lang/pt_BR.lang" ]; then
              mv -f build_dir/assets/minecraft/lang/pt_BR.lang build_dir/assets/minecraft/lang/pt_br.lang
            fi
            rm -f build_dir/assets/minecraft/lang/*.json 2>/dev/null || true
          elif [ "${{ matrix.format }}" -eq 2 ]; then
            rm -f build_dir/assets/minecraft/lang/*.json 2>/dev/null || true
          fi

          # Locale Files for 1.13+ (Format 4+)
          if [ "${{ matrix.format }}" -ge 4 ]; then
            mkdir -p build_dir/assets/minecraft/lang
            if [ -f "build_dir/assets/minecraft/lang/pt_BR.json" ]; then
              mv -f build_dir/assets/minecraft/lang/pt_BR.json build_dir/assets/minecraft/lang/pt_br.json
            fi
            rm -f build_dir/assets/minecraft/lang/*.lang 2>/dev/null || true
          fi

          # Mojang Splash Screen (Format 6+)
          TITLE_GUI="build_dir/assets/minecraft/textures/gui/title"
          if [ "${{ matrix.format }}" -ge 6 ]; then
            rm -f "$TITLE_GUI/mojang.png" 2>/dev/null || true
          else
            rm -f "$TITLE_GUI/mojangstudios.png" 2>/dev/null || true
          fi

          # --- 2. REMOVE CONVERTER INTERFERENCE ---
          find build_dir/assets/minecraft/blockstates/ -type f \( -name "*pressure_plate*.json" -o -name "*slab*.json" \) -delete 2>/dev/null || true
          find build_dir/assets/minecraft/models/block/ -type f \( -name "*banner*.json" -o -name "*pressure_plate*.json" -o -name "*slab*.json" \) -delete 2>/dev/null || true
          find build_dir/assets/minecraft/models/item/ -type f \( -name "*banner*.json" -o -name "*pressure_plate*.json" -o -name "*slab*.json" \) -delete 2>/dev/null || true
          find build_dir/assets/minecraft/textures/entity/ -name "*banner*.png" -type f -delete 2>/dev/null || true
          rm -rf build_dir/assets/minecraft/textures/entity/banner/ 2>/dev/null || true

          # --- 3. ERA MCPATCHER / OPTIFINE FOLDER FIXES ---
          if [ "${{ matrix.format }}" -lt 4 ]; then
            if [ -d "build_dir/assets/minecraft/optifine" ]; then
              mkdir -p build_dir/assets/minecraft/mcpatcher
              cp -rn build_dir/assets/minecraft/optifine/. build_dir/assets/minecraft/mcpatcher/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/optifine
            fi

            if [ -d "build_dir/assets/minecraft/mcpatcher" ]; then
              find build_dir/assets/minecraft/mcpatcher/ -type f -name "*.properties" -exec sed -i 's/optifine\//mcpatcher\//g' {} + 2>/dev/null || true
            fi

            # Prevent leaked modern 'item'/'block' folders on legacy 1.9–1.12.2
            if [ -d "build_dir/assets/minecraft/textures/item" ]; then
              mkdir -p build_dir/assets/minecraft/textures/items
              cp -rn build_dir/assets/minecraft/textures/item/. build_dir/assets/minecraft/textures/items/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/textures/item
            fi
            if [ -d "build_dir/assets/minecraft/textures/block" ]; then
              mkdir -p build_dir/assets/minecraft/textures/blocks
              cp -rn build_dir/assets/minecraft/textures/block/. build_dir/assets/minecraft/textures/blocks/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/textures/block
            fi
          else
            if [ -d "build_dir/assets/minecraft/mcpatcher" ]; then
              mkdir -p build_dir/assets/minecraft/optifine
              cp -rn build_dir/assets/minecraft/mcpatcher/. build_dir/assets/minecraft/optifine/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/mcpatcher
            fi

            if [ -d "build_dir/assets/minecraft/optifine/sky" ]; then
              find build_dir/assets/minecraft/optifine/sky/ -type f -name "*.properties" -exec sed -i 's/mcpatcher\/sky/optifine\/sky/g' {} + 2>/dev/null || true
            fi

            find build_dir/assets/minecraft/models/item/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            find build_dir/assets/minecraft/models/block/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            find build_dir/assets/minecraft/blockstates/ -type f -name "*bed*.json" -delete 2>/dev/null || true

            if [ -d "build_dir/assets/minecraft/textures/items" ]; then
              mkdir -p build_dir/assets/minecraft/textures/item
              cp -rn build_dir/assets/minecraft/textures/items/. build_dir/assets/minecraft/textures/item/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/textures/items
            fi

            if [ -d "build_dir/assets/minecraft/textures/blocks" ]; then
              mkdir -p build_dir/assets/minecraft/textures/block
              cp -rn build_dir/assets/minecraft/textures/blocks/. build_dir/assets/minecraft/textures/block/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/textures/blocks
            fi

            find build_dir/assets/minecraft/models/ -type f -name "*.json" -exec sed -i 's/items\//item\//g; s/blocks\//block\//g' {} + 2>/dev/null || true
            find build_dir/assets/minecraft/optifine/ -type f -name "*.properties" -exec sed -i 's/items\//item\//g; s/blocks\//block\//g' {} + 2>/dev/null || true
          fi

      - name: Prune Version-Specific Incompatible Assets
        run: |
          python3 - << 'EOF'
          import os
          import glob
          import shutil

          fmt = int("${{ matrix.format }}")
          base_dir = "build_dir/assets/minecraft"

          def purge_glob(pattern):
              for path in glob.glob(os.path.join(base_dir, pattern), recursive=True):
                  if os.path.isfile(path) or os.path.islink(path):
                      os.remove(path)
                      mcmeta = path + ".mcmeta"
                      if os.path.exists(mcmeta):
                          os.remove(mcmeta)
                  elif os.path.isdir(path):
                      shutil.rmtree(path, ignore_errors=True)

          # --- SPAWN EGGS (Format <= 3 vs Format >= 4) ---
          if fmt <= 3:
              purge_glob("models/item/*spawn_egg*.json")
              purge_glob("models/block/*spawn_egg*.json")
          else:
              purge_glob("**/cit/spawn_egg*")
              find_color_props = glob.glob(os.path.join(base_dir, "**/color.properties"), recursive=True)
              for cp in find_color_props:
                  try:
                      with open(cp, "r") as f:
                          lines = [l for l in f if not l.strip().startswith("egg.")]
                      with open(cp, "w") as f:
                          f.writelines(lines)
                  except Exception:
                      pass

          # --- 1.21+ (Format < 88) ---
          if fmt < 88:
              purge_glob("**/ctm/**/crafter*")
              purge_glob("**/ctm/**/polished_tuff*")
              purge_glob("**/ctm/**/copper/grate*")
              purge_glob("**/ctm/**/copper/chiseled*")
              purge_glob("textures/**/gui/**/crafter*")
              purge_glob("textures/**/copper_axe*")
              purge_glob("textures/**/copper_hoe*")
              purge_glob("textures/**/copper_pickaxe*")
              purge_glob("textures/**/copper_shovel*")
              purge_glob("textures/**/copper_sword*")
              purge_glob("textures/**/copper_helmet*")
              purge_glob("textures/**/copper_chestplate*")
              purge_glob("textures/**/copper_leggings*")
              purge_glob("textures/**/copper_boots*")
              purge_glob("textures/**/mace*")
              purge_glob("textures/**/flow_banner_pattern*")
              purge_glob("textures/**/guster_banner_pattern*")

          # --- 1.19+ (Format < 9) ---
          if fmt < 9:
              purge_glob("**/ctm/**/froglights*")
              purge_glob("**/ctm/**/reinforced_deepslate*")

          # --- 1.17+ (Format < 7) ---
          if fmt < 7:
              purge_glob("**/ctm/**/chiseled_deepslate*")
              purge_glob("**/ctm/**/deepslate*")
              purge_glob("**/ctm/**/polished_deepslate*")
              purge_glob("**/ctm/**/copper*")
              purge_glob("**/ctm/**/glass/tinted_glass*")
              purge_glob("**/ctm/**/metals_and_gems/ore/copper_ore*")
              purge_glob("**/ctm/**/metals_and_gems/ore/deepslate_*")
              purge_glob("textures/**/axolotl_bucket*")

          # --- 1.16+ (Format < 6) ---
          if fmt < 6:
              purge_glob("textures/**/netherite_*")
              purge_glob("textures/**/piglin_banner_pattern*")

          # --- 1.15 - 1.16+ (Format < 5) ---
          if fmt < 5:
              purge_glob("**/ctm/**/beehive*")
              purge_glob("**/ctm/**/beenest*")
              purge_glob("**/ctm/**/chiseled_nether_bricks*")
              purge_glob("**/ctm/**/chiseled_polished_blackstone*")
              purge_glob("**/ctm/**/netherite_block*")
              purge_glob("**/ctm/**/polished_basalt*")
              purge_glob("**/ctm/**/polished_blackstone*")
              purge_glob("**/ctm/**/quartz_bricks*")
              purge_glob("**/ctm/**/shroomlight*")
              purge_glob("**/ctm/**/metals_and_gems/ore/nether_gold_ore*")
              purge_glob("textures/**/items/honeycomb*")
              purge_glob("textures/**/item/honeycomb*")
              purge_glob("textures/**/items/honey_bottle*")
              purge_glob("textures/**/item/honey_bottle*")
              purge_glob("textures/**/gui/**/blast_furnace*")
              purge_glob("textures/**/gui/**/smoker*")
              purge_glob("textures/**/gui/**/smithing*")
              purge_glob("textures/**/misc/enchanted_glint_item.png")
              purge_glob("textures/**/misc/enchanted_glint_armor.png")
          else:
              purge_glob("textures/**/misc/enchanted_item_glint.png")

          # --- 1.14+ (Format < 4) ---
          if fmt < 4:
              purge_glob("textures/items/structure_void*")
              purge_glob("**/ctm/**/cartography_table*")
              purge_glob("**/ctm/**/loom*")
              purge_glob("textures/**/blocks/blue_ice.png")
              purge_glob("textures/**/blocks/cornflower.png")
              purge_glob("textures/**/blocks/kelp*.png")
              purge_glob("textures/**/blocks/lectern_*.png")
              purge_glob("textures/**/blocks/cut_*_sandstone.png")
              purge_glob("textures/**/crossbow*")
              purge_glob("textures/**/campfire*")
              purge_glob("textures/**/lantern*")
              purge_glob("textures/**/phantom_membrane*")
              purge_glob("textures/**/sweet_berries*")
              purge_glob("textures/**/globe_banner_pattern*")
              purge_glob("textures/**/creeper_banner_pattern*")
              purge_glob("textures/**/flower_banner_pattern*")
              purge_glob("textures/**/mojang_banner_pattern*")
              purge_glob("textures/**/skull_banner_pattern*")
              purge_glob("textures/**/cod_bucket*")
              purge_glob("textures/**/salmon_bucket*")
              purge_glob("textures/**/pufferfish_bucket*")
              purge_glob("textures/**/tropical_fish_bucket*")
              purge_glob("textures/**/gui/**/cartography_table*")
              purge_glob("textures/**/gui/**/grindstone*")
              purge_glob("textures/**/gui/**/loom*")
              purge_glob("textures/**/gui/**/stonecutter*")
              purge_glob("textures/**/gui/**/nautilus*")
              purge_glob("textures/**/gui/**/recipe_book*")
              purge_glob("textures/**/gui/**/recipe_background*")
              purge_glob("textures/**/gui/**/gamemode_switcher*")
              purge_glob("textures/**/gui/**/advancements*")
              # Wood signs
              purge_glob("textures/**/spruce_sign*")
              purge_glob("textures/**/birch_sign*")
              purge_glob("textures/**/jungle_sign*")
              purge_glob("textures/**/acacia_sign*")
              purge_glob("textures/**/dark_oak_sign*")
              purge_glob("textures/**/oak_sign*")
              # Redundant modern dye identifiers (< 1.14)
              purge_glob("textures/**/black_dye*")
              purge_glob("textures/**/white_dye*")
              purge_glob("textures/**/blue_dye*")
              purge_glob("textures/**/brown_dye*")
              purge_glob("textures/**/red_dye*")
              purge_glob("textures/**/green_dye*")
              purge_glob("textures/**/yellow_dye*")
              purge_glob("textures/**/cyan_dye*")
              purge_glob("textures/**/gray_dye*")
              purge_glob("textures/**/light_blue_dye*")
              purge_glob("textures/**/light_gray_dye*")
              purge_glob("textures/**/lime_dye*")
              purge_glob("textures/**/magenta_dye*")
              purge_glob("textures/**/orange_dye*")
              purge_glob("textures/**/pink_dye*")
              purge_glob("textures/**/purple_dye*")

          # --- 1.13 FLATTENING CLEANUP (Format >= 4 vs Legacy) ---
          if fmt >= 4:
              purge_glob("textures/item/bow_standby.png")
              purge_glob("textures/item/minecart_normal.png")
              purge_glob("textures/item/minecart_*.png")
              purge_glob("textures/item/door_*.png")
              purge_glob("textures/item/wood_*.png")
              purge_glob("textures/item/gold_*.png")
              purge_glob("textures/item/dye_powder_*.png")
              purge_glob("textures/item/fish_*_raw.png")
              purge_glob("textures/item/fish_*_cooked.png")
              purge_glob("textures/item/beef_raw.png")
              purge_glob("textures/item/beef_cooked.png")
              purge_glob("textures/item/chicken_raw.png")
