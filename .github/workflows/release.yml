name: Ultimate Universal Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Selection Mode'
        type: choice
        options:
          - 'only'
          - 'all_but'
          - 'all'
        default: 'only'
        required: true
      v_1_8:
        description: '1.6.1-1.8.9'
        required: false
        default: false
        type: boolean
      v_1_9:
        description: '1.9-1.10.2'
        required: false
        default: false
        type: boolean
      v_1_11:
        description: '1.11-1.12.2'
        required: false
        default: false
        type: boolean
      v_1_13:
        description: '1.13-1.14.4'
        required: false
        default: false
        type: boolean
      v_1_15:
        description: '1.15-1.15.2'
        required: false
        default: false
        type: boolean
      v_1_16_1:
        description: '1.16-1.16.1'
        required: false
        default: false
        type: boolean
      v_1_16_2:
        description: '1.16.2-1.16.5'
        required: false
        default: false
        type: boolean
      v_1_17:
        description: '1.17-1.17.1'
        required: false
        default: false
        type: boolean
      v_1_18:
        description: '1.18-1.18.2'
        required: false
        default: false
        type: boolean
      v_1_19:
        description: '1.19-1.19.2'
        required: false
        default: false
        type: boolean
      v_1_19_3:
        description: '1.19.3'
        required: false
        default: false
        type: boolean
      v_1_19_4:
        description: '1.19.4'
        required: false
        default: false
        type: boolean
      v_1_20:
        description: '1.20-1.20.1'
        required: false
        default: false
        type: boolean
      v_1_20_2:
        description: '1.20.2-26.x'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  setup:
    name: Prepare Build Matrix
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      count: ${{ steps.set-matrix.outputs.count }}
    steps:
      - name: Calculate Target Matrix
        id: set-matrix
        env:
          INPUTS_JSON: ${{ toJson(inputs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          ALL_VERSIONS='[
            {"key": "v_1_8", "filename": "1.6.1-1.8.9", "mc_ver": "1.8", "format": 1, "is_base": true},
            {"key": "v_1_9", "filename": "1.9-1.10.2", "mc_ver": "1.9", "format": 2},
            {"key": "v_1_11", "filename": "1.11-1.12.2", "mc_ver": "1.11", "format": 3},
            {"key": "v_1_13", "filename": "1.13-1.14.4", "mc_ver": "1.13", "format": 4},
            {"key": "v_1_15", "filename": "1.15-1.15.2", "mc_ver": "1.15", "format": 5},
            {"key": "v_1_16_1", "filename": "1.16-1.16.1", "mc_ver": "1.16.1", "format": 5},
            {"key": "v_1_16_2", "filename": "1.16.2-1.16.5", "mc_ver": "1.16.2", "format": 6},
            {"key": "v_1_17", "filename": "1.17-1.17.1", "mc_ver": "1.17", "format": 7},
            {"key": "v_1_18", "filename": "1.18-1.18.2", "mc_ver": "1.18", "format": 8},
            {"key": "v_1_19", "filename": "1.19-1.19.2", "mc_ver": "1.19", "format": 9},
            {"key": "v_1_19_3", "filename": "1.19.3", "mc_ver": "1.19.3", "format": 12},
            {"key": "v_1_19_4", "filename": "1.19.4", "mc_ver": "1.19.4", "format": 13},
            {"key": "v_1_20", "filename": "1.20-1.20.1", "mc_ver": "1.20", "format": 15},
            {"key": "v_1_20_2", "filename": "1.20.2-26.x", "mc_ver": "1.21.4", "format": 88, "is_modern": true}
          ]'

          MODE=$(echo "$INPUTS_JSON" | jq -r '.mode // "only"')

          if [ "$EVENT_NAME" = "release" ] || [ "$MODE" = "all" ]; then
            COMPACT=$(echo "$ALL_VERSIONS" | jq -c '{include: .}')
          elif [ "$MODE" = "all_but" ]; then
            COMPACT=$(echo "$ALL_VERSIONS" | jq -c --argjson inputs "$INPUTS_JSON" '{
              include: [.[] | select(($inputs[.key] // false) == false)]
            }')
          else
            COMPACT=$(echo "$ALL_VERSIONS" | jq -c --argjson inputs "$INPUTS_JSON" '{
              include: [.[] | select(($inputs[.key] // false) == true)]
            }')
          fi

          SELECTED_COUNT=$(echo "$COMPACT" | jq '.include | length')
          if [ "$SELECTED_COUNT" -eq 0 ]; then
            echo "::error::No versions were selected for building."
            exit 1
          fi

          echo "matrix=$COMPACT" >> "$GITHUB_OUTPUT"
          echo "count=$SELECTED_COUNT" >> "$GITHUB_OUTPUT"

  build_packs:
    name: Build ${{ matrix.filename }}
    needs: setup
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java (For Converter)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download ResourcePackConverter
        run: wget -q -O converter.jar https://github.com/agentdid127/ResourcePackConverter/releases/download/2.2.6/ResourcePackConverter.jar

      - name: Prepare Base Version (1.8.9)
        if: matrix.is_base
        run: |
          mkdir -p build_dir
          cp -r src/* build_dir/

      - name: Convert to Newer Versions
        if: '!matrix.is_base'
        run: |
          mkdir -p build_dir
          cp -r src ToConvert
          java -Xms2G -Xmx8G -jar converter.jar --from 1.8 --to ${{ matrix.mc_ver }} --input ToConvert
          CONVERTED_DIR=$(find . -maxdepth 1 -type d -name "ToConvert_*" | head -n 1)
          if [ -n "$CONVERTED_DIR" ]; then
            cp -r "$CONVERTED_DIR"/* build_dir/
          else
            cp -r ToConvert/* build_dir/
          fi
          rm -rf ToConvert ToConvert_* converter.jar

          # --- 1. SELECTIVE OVERRIDES & CONVERSION CLEANUP ---

          # Preserve base Smooth Stone CTM up to 1.12.2 (Formats 1, 2, and 3)
          if [ "${{ matrix.format }}" -lt 4 ]; then
            # Revert any smooth stone CTM back to base src/ assets
            for ctm_dir in "assets/minecraft/mcpatcher/ctm" "assets/minecraft/optifine/ctm"; do
              if [ -d "src/$ctm_dir" ]; then
                find "src/$ctm_dir" -type f \( -name "*stone_slab*" -o -name "*smooth_stone*" -o -name "*stone*" \) | while read -r file; do
                  target="build_dir/${file#src/}"
                  mkdir -p "$(dirname "$target")"
                  cp -f "$file" "$target"
                done
              fi
            done

            # Restore base smooth stone block/item textures if converted incorrectly
            for tex_dir in "assets/minecraft/textures/blocks" "assets/minecraft/textures/items"; do
              if [ -d "src/$tex_dir" ]; then
                find "src/$tex_dir" -type f \( -name "*stone_slab*" -o -name "*stone*" \) | while read -r file; do
                  target="build_dir/${file#src/}"
                  mkdir -p "$(dirname "$target")"
                  cp -f "$file" "$target"
                done
              fi
            done
          fi

          # CTM Cleanup and Injection
          if [ "${{ matrix.format }}" -ge 4 ]; then
            # The Flattening (1.13+) changed block IDs and structures.
            # Delete legacy CTM completely to prevent conflicts.
            rm -rf build_dir/assets/minecraft/mcpatcher/ctm 2>/dev/null || true
            rm -rf build_dir/assets/minecraft/optifine/ctm 2>/dev/null || true
          else
            # For 1.8 to 1.12.2 (Formats 1, 2, 3) specific overrides:
            # 1. Bone Blocks CTM (Added 1.10 / Format 2+)
            if [ "${{ matrix.format }}" -ge 2 ]; then
              if [ -d "modern_override/assets/minecraft/optifine/ctm/default/bone" ]; then
                mkdir -p build_dir/assets/minecraft/mcpatcher/ctm/default
                cp -r modern_override/assets/minecraft/optifine/ctm/default/bone build_dir/assets/minecraft/mcpatcher/ctm/default/
              fi
            fi
          fi

          # Apply Modern Overrides
          # Formats 4+ (1.13+) get the FULL modern override package (models, textures, modern CTM structure)
          if [ "${{ matrix.format }}" -ge 4 ]; then
            if [ -d "modern_override" ]; then
              # Using -rf to purposefully overwrite legacy files with modern ones
              cp -rf modern_override/* build_dir/ 2>/dev/null || true
            fi
          fi

          # --- BONE BLOCK RENDER BUG FIX (1.13 - 1.15.2) ---
          # Deletes the custom blockstate file so vanilla takes over the rotation logic explicitly for the broken versions, leaving it intact for 1.16+
          if [ "${{ matrix.mc_ver }}" = "1.13" ] || [ "${{ matrix.mc_ver }}" = "1.15" ]; then
            rm -f build_dir/assets/minecraft/blockstates/bone_block.json 2>/dev/null || true
          fi

          # GUI Container Overrides for 1.9+ (Formats 2+)
          if [ "${{ matrix.format }}" -ge 2 ]; then
            GUI_CONT="build_dir/assets/minecraft/textures/gui/container"
            MOD_CONT="modern_override/assets/minecraft/textures/gui/container"
            mkdir -p "$GUI_CONT/creative_inventory"
            
            # 1.9+ (Format 2+): Offhand slots & Blaze Powder fuel
            cp -f "$MOD_CONT/inventory.png" "$GUI_CONT/" 2>/dev/null || true
            cp -f "$MOD_CONT/brewing_stand.png" "$GUI_CONT/" 2>/dev/null || true
            cp -f "$MOD_CONT/creative_inventory/tab_inventory.png" "$GUI_CONT/creative_inventory/" 2>/dev/null || true
            
            # 1.11+ & 1.12+ (Format 3+): Llama UI, Recipe Book, Shulker Boxes
            if [ "${{ matrix.format }}" -ge 3 ]; then
              cp -f "$MOD_CONT/shulker_box.png" "$GUI_CONT/" 2>/dev/null || true
              cp -f "$MOD_CONT/horse.png" "$GUI_CONT/" 2>/dev/null || true
              cp -f "$MOD_CONT/crafting_table.png" "$GUI_CONT/" 2>/dev/null || true
            fi
          fi

          # Creative Tabs Override (Format 12+) 
          CREATIVE_GUI="build_dir/assets/minecraft/textures/gui/container/creative_inventory"
          if [ "${{ matrix.format }}" -ge 12 ]; then
            if [ -f "modern_override/assets/minecraft/textures/gui/container/creative_inventory/tabsfor1.19.3+.png" ]; then
              mkdir -p "$CREATIVE_GUI"
              cp -f "modern_override/assets/minecraft/textures/gui/container/creative_inventory/tabsfor1.19.3+.png" "$CREATIVE_GUI/tabs.png"
            fi
          fi
          rm -f "$CREATIVE_GUI/tabsfor1.19.3+.png" 2>/dev/null || true

          # Spawn Eggs for 1.9 to 1.12.2 (Formats 2 & 3)
          if [ "${{ matrix.format }}" -ge 2 ] && [ "${{ matrix.format }}" -lt 4 ]; then
            if [ -d "modern_override/assets/minecraft/optifine/cit/spawn_egg" ]; then
              mkdir -p build_dir/assets/minecraft/mcpatcher/cit/spawn_egg
              cp -r modern_override/assets/minecraft/optifine/cit/spawn_egg/* build_dir/assets/minecraft/mcpatcher/cit/spawn_egg/ 2>/dev/null || true
            fi
          fi

          # Bed Models (Format 2 Only)
          if [ "${{ matrix.format }}" -eq 2 ]; then
            mkdir -p build_dir/assets/minecraft/models/item build_dir/assets/minecraft/models/block
            find build_dir/assets/minecraft/models/item/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            find build_dir/assets/minecraft/models/block/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            if [ -f "modern_override/assets/minecraft/models/item/bed.json" ]; then
              cp modern_override/assets/minecraft/models/item/bed.json build_dir/assets/minecraft/models/item/ 2>/dev/null || true
            fi
            if [ -d "modern_override/assets/minecraft/models/block" ]; then
              cp -r modern_override/assets/minecraft/models/block/*bed*.json build_dir/assets/minecraft/models/block/ 2>/dev/null || true
            fi
          fi

          # Cleanup Bed Models (Format 3+)
          if [ "${{ matrix.format }}" -ge 3 ]; then
            find build_dir/assets/minecraft/models/item/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            find build_dir/assets/minecraft/models/block/ -type f -name "*bed*.json" -delete 2>/dev/null || true
            find build_dir/assets/minecraft/blockstates/ -type f -name "*bed*.json" -delete 2>/dev/null || true
          fi

          # Command Block Models: Pre-Flattening (Formats 2 & 3)
          if [ "${{ matrix.format }}" -ge 2 ] && [ "${{ matrix.format }}" -lt 4 ]; then
            if [ -d "src/assets/minecraft/models/block" ]; then
              mkdir -p build_dir/assets/minecraft/models/block
              cp -f src/assets/minecraft/models/block/*command_block*.json build_dir/assets/minecraft/models/block/ 2>/dev/null || true
            fi
          fi

          # Locale Files for 1.9 - 1.12.2 (Formats 2 & 3)
          if [ "${{ matrix.format }}" -eq 3 ]; then
            mkdir -p build_dir/assets/minecraft/lang
            if [ -f "build_dir/assets/minecraft/lang/pt_BR.lang" ]; then
              mv -f build_dir/assets/minecraft/lang/pt_BR.lang build_dir/assets/minecraft/lang/pt_br.lang
            fi
            rm -f build_dir/assets/minecraft/lang/*.json 2>/dev/null || true
          elif [ "${{ matrix.format }}" -eq 2 ]; then
            rm -f build_dir/assets/minecraft/lang/*.json 2>/dev/null || true
          fi

          # Mojang Splash Screen (Introduced in 1.13 / Format 4)
          TITLE_GUI="build_dir/assets/minecraft/textures/gui/title"
          if [ "${{ matrix.format }}" -ge 6 ]; then
            rm -f "$TITLE_GUI/mojang.png" 2>/dev/null || true
          elif [ "${{ matrix.format }}" -ge 4 ]; then
            rm -f "$TITLE_GUI/mojangstudios.png" 2>/dev/null || true
          fi

          # Locale Files for 1.13+ (Format 4+)
          if [ "${{ matrix.format }}" -ge 4 ]; then
            mkdir -p build_dir/assets/minecraft/lang
            if [ -f "build_dir/assets/minecraft/lang/pt_BR.json" ]; then
              mv -f build_dir/assets/minecraft/lang/pt_BR.json build_dir/assets/minecraft/lang/pt_br.json
            fi
            rm -f build_dir/assets/minecraft/lang/*.lang 2>/dev/null || true
            
            # --- OVERRIDE FOR 1.16+ LANG FILE ---
            # Format 5 covers 1.15-1.16.1. We apply this to format 5 and above.
            if [ "${{ matrix.format }}" -ge 5 ]; then
              cp -f "modern_override/assets/minecraft/lang/pt_br1.16.json" build_dir/assets/minecraft/lang/pt_br.json
            fi
          fi

          # Clean up slab and pressure plate files for versions 1.13 and above (Format 4+)
          if [ "${{ matrix.format }}" -ge 4 ]; then
            find build_dir/assets/minecraft/blockstates/ -type f \( -name "*pressure_plate*.json" -o -name "*slab*.json" \) -delete 2>/dev/null || true
            find build_dir/assets/minecraft/models/block/ -type f \( -name "*pressure_plate*.json" -o -name "*slab*.json" \) -delete 2>/dev/null || true
            find build_dir/assets/minecraft/models/item/ -type f \( -name "*pressure_plate*.json" -o -name "*slab*.json" \) -delete 2>/dev/null || true
          fi

          # --- 1.5 FIX EMPTY ARMOR SLOTS (1.19.4 to 1.20.1) ---
          if [ "${{ matrix.format }}" -ge 13 ] && [ "${{ matrix.format }}" -lt 18 ]; then
            SRC_SLOTS="src/assets/minecraft/textures/items"
            DEST="build_dir/assets/minecraft/textures/item"
            mkdir -p "$DEST"
            for slot in helmet chestplate leggings boots; do
              if [ -f "$SRC_SLOTS/empty_armor_slot_${slot}.png" ]; then
                cp -f "$SRC_SLOTS/empty_armor_slot_${slot}.png" "$DEST/empty_slot_${slot}.png" 2>/dev/null || true
              fi
            done
          fi

          # --- 2. ERA MCPATCHER / OPTIFINE FOLDER FIXES ---
          if [ "${{ matrix.format }}" -lt 4 ]; then
            # For 1.8.9 - 1.12.2: Ensure everything is in 'mcpatcher'
            if [ -d "build_dir/assets/minecraft/optifine" ]; then
              mkdir -p build_dir/assets/minecraft/mcpatcher
              cp -rn build_dir/assets/minecraft/optifine/. build_dir/assets/minecraft/mcpatcher/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/optifine
            fi

            if [ -d "build_dir/assets/minecraft/mcpatcher" ]; then
              find build_dir/assets/minecraft/mcpatcher/ -type f -name "*.properties" -exec sed -i 's/optifine\//mcpatcher\//g' {} + 2>/dev/null || true
              find build_dir/assets/minecraft/mcpatcher/ -type f -name "*.properties" -exec sed -i 's/item\//items\//g; s/block\//blocks\//g' {} + 2>/dev/null || true
            fi

            # Re-route any leaked 'item'/'block' directories to legacy plural equivalents
            if [ -d "build_dir/assets/minecraft/textures/item" ]; then
              mkdir -p build_dir/assets/minecraft/textures/items
              cp -rn build_dir/assets/minecraft/textures/item/. build_dir/assets/minecraft/textures/items/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/textures/item
            fi
            if [ -d "build_dir/assets/minecraft/textures/block" ]; then
              mkdir -p build_dir/assets/minecraft/textures/blocks
              cp -rn build_dir/assets/minecraft/textures/block/. build_dir/assets/minecraft/textures/blocks/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/textures/block
            fi
          else
            # For 1.13+ (Format 4+): Ensure everything is in 'optifine'
            if [ -d "build_dir/assets/minecraft/mcpatcher" ]; then
              mkdir -p build_dir/assets/minecraft/optifine
              cp -rn build_dir/assets/minecraft/mcpatcher/. build_dir/assets/minecraft/optifine/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/mcpatcher
            fi

            if [ -d "build_dir/assets/minecraft/optifine" ]; then
              find build_dir/assets/minecraft/optifine/ -type f -name "*.properties" -exec sed -i 's/mcpatcher\//optifine\//g' {} + 2>/dev/null || true
            fi

            if [ -d "build_dir/assets/minecraft/textures/items" ]; then
              mkdir -p build_dir/assets/minecraft/textures/item
              cp -rn build_dir/assets/minecraft/textures/items/. build_dir/assets/minecraft/textures/item/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/textures/items
            fi

            if [ -d "build_dir/assets/minecraft/textures/blocks" ]; then
              mkdir -p build_dir/assets/minecraft/textures/block
              cp -rn build_dir/assets/minecraft/textures/blocks/. build_dir/assets/minecraft/textures/block/ 2>/dev/null || true
              rm -rf build_dir/assets/minecraft/textures/blocks
            fi

            find build_dir/assets/minecraft/models/ -type f -name "*.json" -exec sed -i 's/items\//item\//g; s/blocks\//block\//g' {} + 2>/dev/null || true
            find build_dir/assets/minecraft/optifine/ -type f -name "*.properties" -exec sed -i 's/items\//item\//g; s/blocks\//block\//g' {} + 2>/dev/null || true
          fi

      - name: Prune Version-Specific Incompatible Assets
        run: python3 prune_assets.py ${{ matrix.format }}

      - name: Inject Legacy mcmeta (Formats 1-15)
        if: '!matrix.is_modern'
        run: |
          jq '.pack.pack_format = ${{ matrix.format }} | del(.pack.supported_formats) | del(.pack.min_format) | del(.pack.max_format)' build_dir/pack.mcmeta > tmp.json
          mv tmp.json build_dir/pack.mcmeta

      - name: Inject Modern mcmeta (Format 18+)
        if: matrix.is_modern
        run: |
          jq '.pack.pack_format = ${{ matrix.format }} | .pack.supported_formats = [18, 999] | .pack.min_format = 18 | .pack.max_format = 999' build_dir/pack.mcmeta > tmp.json
          mv tmp.json build_dir/pack.mcmeta

      - name: Optimize with PackSquash
        uses: ComunidadAylas/PackSquash-action@v4
        with:
          packsquash_version: v0.4.1
          action_cache_revision: "local-${{ github.run_id }}-${{ matrix.filename }}"
          options: |
            pack_directory = 'build_dir'
            output_file_path = 'Klassic Orange PvP-${{ matrix.filename }}.zip'
            allow_mods = ['OptiFine']
            never_store_squash_times = true
            spooling_buffers_size = 512
            zip_compression_iterations = 255
            zip_spec_conformance_level = 'pedantic'
            recompress_compressed_files = true

            ['**/*.png']
            image_data_compression_iterations = 255
            downsize_if_single_color = true

      - name: Attach Zips to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: "Klassic Orange PvP-${{ matrix.filename }}.zip"
          
      - name: Upload Single Pack Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klassic-Orange-PvP-${{ matrix.filename }}
          path: "Klassic Orange PvP-${{ matrix.filename }}.zip"
          retention-days: 1

      - name: Stage Pack Artifact for Bundler
        if: needs.setup.outputs.count > 1
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.filename }}
          path: "Klassic Orange PvP-${{ matrix.filename }}.zip"
          retention-days: 1

  bundle_artifacts:
    name: Bundle All Packs
    needs: [setup, build_packs]
    if: needs.setup.outputs.count > 1
    runs-on: self-hosted
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean Runner Directory
        run: rm -rf bundle_output

      - name: Download all staged packs
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: bundle_output

      - name: Upload Grouped Bundle
        uses: actions/upload-artifact@v4
        with:
          name: Klassic-Orange-PvP-All-Selected-Packs
          path: bundle_output/*.zip
          retention-days: 1

      - name: Cleanup temporary staging parts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const res = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of res.data.artifacts) {
              if (artifact.name.startsWith('part-')) {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }